name: frontend-deploy

# Deploy the React SPA to Azure Static Web Apps (ADR-211, story #280).
# Production comes from main, pull requests get a preview environment that is removed when the PR closes.
# Requires the repository secret AZURE_STATIC_WEB_APPS_API_TOKEN (deployment token of the Static Web App)
# and the repository variable VITE_API_URL (public URL of the API, baked into the build).
on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-deploy.yml'
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-deploy.yml'
  workflow_dispatch:

concurrency:
  group: frontend-deploy-${{ github.ref }}
  # Cancel outdated previews, but never interrupt a production deployment.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  pull-requests: write

env:
  VITE_API_URL: ${{ vars.VITE_API_URL }}

jobs:
  build-test:
    name: frontend-build-test
    if: github.event_name != 'pull_request' || github.event.action != 'closed'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      # Failing tests stop the workflow here, so nothing broken reaches Azure.
      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          if-no-files-found: error
          retention-days: 1

  deploy:
    name: deploy
    needs: build-test
    # Forks do not get repository secrets, so their PRs only run the checks above.
    if: >
      needs.build-test.result == 'success' &&
      (github.event_name == 'push' ||
       github.event_name == 'workflow_dispatch' ||
       (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: ${{ github.event_name == 'pull_request' && format('preview-pr-{0}', github.event.pull_request.number) || 'production' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist

      - name: Deploy to Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          # The workflow already ran lint, tests and the build, so only the built output is uploaded.
          app_location: frontend/dist
          api_location: ''
          output_location: ''
          skip_app_build: true
        env:
          # Until the Azure resource exists the deployment is skipped instead of failing main.
          SKIP_DEPLOY_ON_MISSING_SECRETS: true

  close-preview:
    name: close-preview
    if: >
      github.event_name == 'pull_request' &&
      github.event.action == 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Close preview environment
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: close
        env:
          SKIP_DEPLOY_ON_MISSING_SECRETS: true
