name: backend

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'SolarOps.slnx'
      - 'Directory.Build.props'
      - 'Directory.Packages.props'
      - 'global.json'
      - '.editorconfig'
      - '.github/workflows/backend.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'tests/**'
      - 'SolarOps.slnx'
      - 'Directory.Build.props'
      - 'Directory.Packages.props'
      - 'global.json'
      - '.editorconfig'
      - '.github/workflows/backend.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Restore
        run: dotnet restore SolarOps.slnx
      - name: Build
        run: dotnet build SolarOps.slnx --no-restore -c Release
      - name: Test (Testcontainers uses the runner's Docker)
        run: dotnet test SolarOps.slnx --no-build -c Release --logger "trx" --collect "XPlat Code Coverage"
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results
          path: tests/**/TestResults/
