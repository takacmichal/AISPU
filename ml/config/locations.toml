# Production data 2023-2024 (DKA Solar Centre, Alice Springs, Australia). Southern hemisphere:
# fixed panels face north, i.e. azimuth 180 in Open-Meteo's convention (0 = south).
# `tilt`/`azimuth` (optional, degrees) set the plane for GTI; without them GTI equals GHI.
# Add the real plant geometry here once known.
[locations.alice_springs]
label = "Alice Springs (DKA Solar Centre)"
