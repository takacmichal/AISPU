# Local development. Only postgres is needed for `dotnet run`:
#   docker compose up -d postgres
# Full stack (API + ML in containers):
#   docker compose --profile app up --build
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-solarops}
      POSTGRES_USER: ${POSTGRES_USER:-solarops}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-solarops}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    profiles: ["app"]
    build:
      context: .
      dockerfile: src/SolarOps.Api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Postgres: Host=postgres;Port=5432;Database=${POSTGRES_DB:-solarops};Username=${POSTGRES_USER:-solarops};Password=${POSTGRES_PASSWORD:-solarops}
      Cors__AllowedOrigins__0: http://localhost:5173
    ports:
      - "${API_PORT:-5080}:8080"
    depends_on:
      postgres:
        condition: service_healthy

  ml:
    profiles: ["app"]
    build:
      context: ml
    ports:
      - "${ML_PORT:-8000}:8000"

volumes:
  postgres-data:
